# Define un bloque de servidor virtual que procesará las peticiones HTTP 
# entrantes.
server {
    # Indica que Nginx escuchará las conexiones en el puerto 80 
    # (puerto estándar para tráfico HTTP no cifrado).
    listen 80;

    # Especifica los nombres de dominio o IPs a los que responde este servidor (en local responde a 'localhost').
    server_name localhost dev.clinica.local dev.clinica.jair-dev.cl test.clinica.jair-dev.cl;

    # Bloque de ubicación para el Frontend: Captura todas las rutas raíz e interfaz web del usuario.
    location / {
        # Define el directorio raíz interno dentro del contenedor donde se guardan las vistas HTML/CSS/JS.
        root /usr/share/nginx/html;

        # Define los archivos que Nginx buscará por defecto al acceder a una carpeta (busca primero index.html).
        index index.html index.htm;

        # Regla de fallback: Intenta entregar el archivo pedido ($uri), si no existe busca la carpeta ($uri/), 
        # y si tampoco existe, redirige al index.html para evitar errores 404 en navegadores.
        try_files $uri $uri/ /index.html;
    }

    # Comentario explicativo sobre el enrutamiento de la API.
    # Redirección de llamadas a la API hacia el Backend (Django)

    # Bloque de ubicación: Captura cualquier petición entrante (desde el navegador) 
    # que comience con la ruta '/api/'. Por ejemplo: '/api/login/' o '/api/reservas/'.
    location /api/ {
    
        # proxy_pass: Reenvía la petición internamente al servicio de Kubernetes del backend.
        # 'backend-service' es el nombre interno del Service en Kubernetes y '8000' el puerto de Django.
        # BARRA FINAL (/'): Al terminar la ruta en '/', Nginx eliminará el prefijo '/api/'.
        # Ejemplo: El navegador pide '/api/login/' -> Nginx lo transforma y le envía a Django '/login/'.
        # Esto es vital para que Django encuentre la ruta en urls.py y no devuelva un Error 404.
        proxy_pass http://backend-service:8000/;

        # Reenvía el nombre de host original del navegador (ej. 'dev.clinica.jair-dev.cl') 
        # hacia Django. Esto es necesario para que Django valide el dominio en ALLOWED_HOSTS.
        proxy_set_header Host $host;

        # Envía la dirección IP real del usuario (cliente) al backend.
        # Es muy útil para que Django registre en sus logs quién está haciendo la petición real.
        proxy_set_header X-Real-IP $remote_addr;

        # Agrega la IP del cliente a la lista de proxies intermedios (cadena de confianza).
        # Mantiene el rastro original del usuario si hay múltiples balanceadores de carga.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Le indica a Django si la conexión original del usuario fue segura (HTTPS) o no (HTTP).
        # Fundamental para que Django genere URLs absolutas correctas o redirecciones seguras.
        proxy_set_header X-Forwarded-Proto $scheme;
        
    # Fin del bloque de ubicación de la API.
    }
}