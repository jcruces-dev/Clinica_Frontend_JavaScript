# Nombre del workflow de Producción.
name: 3. Release Frontend to Production

# Define CUÁNDO se ejecuta.
on:
  # Se ejecuta exclusivamente cuando creas un Tag (ej. v1.0.0).
  push:
    tags:
      - 'v*'
  # Permite ejecutarlo manualmente.
  workflow_dispatch:

# Variables globales.
env:
  IMAGE_NAME: ghcr.io/jcruces-dev/frontend-clinica-bp

# Definición de trabajos.
jobs:
  # ==========================================================
  # JOB 1: Construir y subir imagen con versión semántica
  # ==========================================================
  build-release:
    name: Build Production Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push (Versión Semántica)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 👇 Usamos el nombre del Tag de Git (ej. v1.0.0) para la imagen de prod.
          tags: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}

  # ==========================================================
  # JOB 2: Desplegar a Producción (Con aprobación manual)
  # ==========================================================
  deploy-prod:
    name: Deploy Frontend to Production
    needs: build-release
    runs-on: ubuntu-latest
    
    # 👇 ESTO ACTIVA LA APROBACIÓN MANUAL DE GITHUB ENVIRONMENTS.
    environment: production 

    steps:
      - name: Checkout repo de infraestructura
        uses: actions/checkout@v4
        with:
          repository: jcruces-dev/clinica-k8s-infrastructure
          token: ${{ secrets.GH_PAT }}
          path: infra

      - name: Actualizar manifiestos de Producción
        run: |
          cd infra
          # El tag es el nombre del release (ej. v1.0.0).
          DEPLOY_TAG="${{ github.ref_name }}"
          # Busca dinámicamente en la carpeta Prod/frontend.
          find Prod/frontend -type f -name "*.yaml" -exec sed -i "s|image: ghcr.io/jcruces-dev/frontend-clinica-bp:.*|image: ghcr.io/jcruces-dev/frontend-clinica-bp:${DEPLOY_TAG}|g" {} +

      - name: Commit y push
        run: |
          cd infra
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Prod/frontend/
          git diff --staged --quiet || git commit -m "Update PROD frontend image to ${{ github.ref_name }}"
          git push