# Nombre del workflow que verás en la pestaña de Actions de GitHub.
name: 3. Release Frontend to Production

# Define CUÁNDO se va a ejecutar este workflow.
on:
  # Se ejecuta cuando subes un tag que empiece con 'v' (ej. v1.0.0).
  push:
    tags:
      - 'v*'
  # Permite ejecutar el workflow manualmente desde la interfaz de GitHub.
  workflow_dispatch:

# Variables globales disponibles para todos los trabajos (jobs).
env:
  # El nombre de la imagen en el registro de contenedores de GitHub.
  IMAGE_NAME: ghcr.io/jcruces-dev/frontend-clinica-bp

# Definición de los trabajos (jobs) que se ejecutarán.
jobs:
  # ==========================================================
  # JOB 1: Construir y subir la imagen a GitHub Packages (GHCR)
  # ==========================================================
  build-release:
    name: Build Production Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push (Versión Semántica)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================
  # JOB 2: Desplegar a Producción (Actualizar el YAML de K8s)
  # ==========================================================
  deploy-prod:
    name: Deploy Frontend to Production
    needs: build-release
    runs-on: ubuntu-latest
    
    # 👇 AQUÍ ESTÁ LA CORRECCIÓN PARA VS CODE 👇
    # Esto le dice a GitHub que use las reglas del entorno "production".
    environment:
      name: production

    steps:
      - name: Checkout repo de infraestructura
        uses: actions/checkout@v4
        with:
          repository: jcruces-dev/clinica-k8s-infrastructure
          token: ${{ secrets.GH_PAT }}
          path: infra

      - name: Actualizar manifiestos de Producción
        run: |
          cd infra
          DEPLOY_TAG="${{ github.ref_name }}"
          find Prod/frontend -type f \( -name "*.yaml" -o -name "*.yml" \) -exec sed -i "s|image: ghcr.io/jcruces-dev/frontend-clinica-bp:.*|image: ghcr.io/jcruces-dev/frontend-clinica-bp:${DEPLOY_TAG}|g" {} +

      - name: Commit y push
        run: |
          cd infra
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Prod/frontend/
          git diff --staged --quiet || git commit -m "Update PROD frontend image to ${{ github.ref_name }}"
          git push