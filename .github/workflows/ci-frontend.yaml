# Nombre del workflow. Es el título que verás en la pestaña "Actions" de GitHub.
name: CI-Frontend-Clinica-BP

# Define los eventos (triggers) que inician la ejecución de este workflow.
on:
  # Se activa cuando se hace un push de un tag (etiqueta).
  push:
    # Especifica que solo se ejecute si el tag comienza con la letra "v" (ej. v1.0.0, v1.1.0).
    tags:
      - 'v*'
  # Permite iniciar el workflow manualmente desde la interfaz web de GitHub Actions.
  workflow_dispatch:

# Define variables de entorno disponibles para todos los trabajos (jobs) del workflow.
env:
  # Nombre y ruta de la imagen Docker que se publicará en GitHub Container Registry (GHCR).
  IMAGE_NAME: ghcr.io/jcruces-dev/frontend-clinica-bp

# Define los trabajos (jobs) que se van a realizar.
jobs:
  # ---------------------------------------------------------
  # TRABAJO 1: Construir y publicar la imagen Docker del frontend.
  # ---------------------------------------------------------
  build-and-push:
    # Nombre visible del trabajo en la interfaz de GitHub.
    name: Build and Push
    # Especifica el sistema operativo de la máquina virtual (runner) donde se ejecutará.
    runs-on: ubuntu-latest
    # Permisos del token de GitHub (GITHUB_TOKEN) para este trabajo.
    permissions:
      # Permiso para leer el código del repositorio.
      contents: read
      # Permiso para escribir (publicar) paquetes en GHCR.
      packages: write

    # Lista de pasos secuenciales para este trabajo.
    steps:
        # Paso 1: Descarga el código del repositorio en el runner.
      - name: Checkout código
        # Es un repositorio oficial de GitHub: actions/checkout es 
        # un repositorio público mantenido por GitHub 
        uses: actions/checkout@v4

      # Paso 2: Autenticación en GitHub Container Registry (GHCR).
      - name: Login a GHCR
        uses: docker/login-action@v3
        with:
          # Dirección del registro.
          registry: ghcr.io
          # Usuario que ejecuta la acción.
          username: ${{ github.actor }}
          # Token automático generado por GitHub con permisos de escritura.
          password: ${{ secrets.GITHUB_TOKEN }}

      # Paso 3: Construir la imagen Docker y subirla a GHCR.
      - name: Build y push
        uses: docker/build-push-action@v5
        with:
          # Ruta al directorio que contiene el Dockerfile (la raíz del repositorio).
          context: .
          # Indica que la imagen debe subirse al registro.
          push: true
          # Etiquetas (tags) con las que se guardará la imagen.
          # Tag basado en el nombre del tag de Git (ej. v1.0.0).
          # Tag basado en el hash (SHA) del commit actual.
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ---------------------------------------------------------
  # TRABAJO 2: Actualizar los manifiestos de Kubernetes.
  # ---------------------------------------------------------
  update-manifest:
    # Nombre visible del trabajo.
    name: Update K8s Manifest
    # Sistema operativo del runner.
    runs-on: ubuntu-latest
    # Dependencia: este trabajo solo se ejecuta si "build-and-push" termina con éxito.
    needs: build-and-push
    steps:
      # Paso 1: Clonar el repositorio de infraestructura donde viven los YAML de Kubernetes.
      - name: Checkout repo de infraestructura
        uses: actions/checkout@v4
        with:
          # Nombre del repositorio a clonar.
          repository: jcruces-dev/clinica-k8s-infrastructure
          # Token de acceso personal (PAT) con permisos de escritura en ese repositorio.
          token: ${{ secrets.GH_PAT }}
          # Carpeta local donde se descargará el repositorio de infraestructura.
          path: infra

      # Paso 2: Modificar los archivos YAML usando el comando "sed".
      - name: Actualizar imagen en los manifiestos
        run: |
          # Entrar a la carpeta del repositorio de infraestructura.
          cd infra
          # Reemplaza el tag antiguo de la imagen del frontend (en Dev) por el nuevo tag de Git.
          sed -i "s|image: ghcr.io/jcruces-dev/frontend-clinica-bp:.*|image: ghcr.io/jcruces-dev/frontend-clinica-bp:${{ github.ref_name }}|g" Dev/frontend/frontend-deployment.yaml
          # Reemplaza el tag antiguo de la imagen del frontend (en Test) por el nuevo tag de Git.
          sed -i "s|image: ghcr.io/jcruces-dev/frontend-clinica-bp:.*|image: ghcr.io/jcruces-dev/frontend-clinica-bp:${{ github.ref_name }}|g" Test/frontend/frontend-deployment.yaml

      # Paso 3: Hacer commit y push de los cambios en el repositorio de infraestructura.
      - name: Commit y push
        run: |
          # Entrar a la carpeta del repositorio de infraestructura.
          cd infra
          # Configurar el nombre de usuario para el commit (el bot de GitHub).
          git config user.name "github-actions[bot]"
          # Configurar el correo electrónico del bot.
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Añadir los archivos modificados al área de preparación (staging).
          git add Dev/frontend/frontend-deployment.yaml Test/frontend/frontend-deployment.yaml
          # Si hay cambios pendientes, hace el commit. Si no hay cambios, no hace nada (evita errores).
          git diff --staged --quiet || git commit -m "Update frontend image to ${{ github.ref_name }}"
          # Subir el commit al repositorio remoto en GitHub.
          git push